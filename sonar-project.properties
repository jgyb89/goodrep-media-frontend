# SonarCloud configuration for goodrep-media-frontend
sonar.projectKey=jgyb89_goodrep-media-frontend
sonar.organization=jgyb89

# Exclude static data configuration files from CPD (Copy-Paste Detector) duplication checks.
# These files contain configuration dictionaries/arrays (services, FAQs, portfolio items, process steps)
# which Sonar CPD flags as duplicate tokens due to repeating schema keys.
sonar.cpd.exclusions=src/data/**
